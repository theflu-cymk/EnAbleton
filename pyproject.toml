[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enableton"
version = "0.1.0b1"
description = "Versioned Ableton Live MCP extensions for production recipes, nested control, and reversible warp diagnostics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "theflu-cymk"}]
keywords = ["ableton", "mcp", "music-production", "warp", "dubstep"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "av==18.1.0",
    "mcp-server-ableton-live==1.8.1",
    "pyyaml==6.0.3",
]

[project.urls]
Homepage = "https://github.com/theflu-cymk/EnAbleton"
Issues = "https://github.com/theflu-cymk/EnAbleton/issues"
Changelog = "https://github.com/theflu-cymk/EnAbleton/blob/main/CHANGELOG.md"

[project.scripts]
enableton = "enableton.cli:main"

[dependency-groups]
dev = ["build==1.3.0", "ruff==0.14.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enableton = ["*.json", "licenses/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E9",     # syntax errors
    "F63",    # invalid comparisons
    "F7",     # real control-flow mistakes
    "F82",    # undefined names
    "B006",   # mutable default argument
    "B008",   # function call in default argument
    "B904",   # raise inside except without explicit chaining
    "S102",   # exec
    "S105",   # hardcoded password
    "S106",   # hardcoded password argument
    "S301",   # pickle
    "S506",   # unsafe yaml load
    "RUF100", # unused noqa
]

[tool.ruff.lint.per-file-ignores]
# The dispatch performance test compiles a generated function on purpose.
"tests/**" = ["S102"]
