name: apply-staged-changes

on:
  push:
    branches:
      - feat/decisions-and-port
    paths:
      - '.staged/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/decisions-and-port
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply staged patch files
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(.staged/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no staged patches; nothing to do"
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "applying $patch"
            git apply -p1 --whitespace=nowarn "$patch"
          done
      - name: Regenerate the lock file and tool catalog
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.22
          uv lock
          uv sync --python 3.12
          uv run python scripts/generate_catalog.py
      - name: Commit the result and remove the staging scaffolding
        run: |
          set -euo pipefail
          rm -rf .staged
          rm -f .github/workflows/apply-staged-changes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply staged changes, regenerate lock and catalog for 0.1.0b2"
          git push origin HEAD:feat/decisions-and-port
